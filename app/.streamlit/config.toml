# Letto da Streamlit accanto allo script (app/main.py), anche avviando dalla root.
# Stesso stile della presentazione (variabili :root del deck): fondo caldo,
# accento verde, Segoe UI, angoli a 12 px. Tema fisso chiaro: con il tema
# scuro del sistema alcune etichette scendevano sotto il contrasto minimo.
[theme]
base = "light"
primaryColor = "#006B54"             # --acc
backgroundColor = "#F4F2ED"          # --bg
secondaryBackgroundColor = "#ECEAE3" # --surf2 (sidebar, campi)
textColor = "#1A1A28"                # --text
font = "Segoe UI, system-ui, sans-serif"
baseRadius = "12px"                  # --r
# riquadri informativi (disclaimer, proiezione) nel verde del deck invece del blu Streamlit (GFX-34)
blueColor = "#006B54"                # --acc
blueBackgroundColor = "#E5F2EE"      # --acc-l
blueTextColor = "#006B54"            # --acc

[client]
toolbarMode = "minimal"   # niente Deploy/Rerun durante la demo

[server]
runOnSave = false

[browser]
gatherUsageStats = false
